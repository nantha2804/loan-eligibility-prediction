<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan Eligibility Predictor</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
      body { margin: 0; padding: 2rem 1rem; }
      main { max-width: 820px; margin: 0 auto; padding: 2rem; background: white; border-radius: 16px; box-shadow: 0 12px 35px #182b4a12; }
      h1 { margin-top: 0; }
      .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
      label { display: grid; gap: .4rem; font-size: .9rem; font-weight: 600; }
      input, select, button { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
      button { margin-top: 1.25rem; border: 0; color: white; background: #2457d6; font-weight: 700; cursor: pointer; }
      #result { min-height: 1.5rem; margin-bottom: 0; font-weight: 700; }
      .note { color: #596579; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Loan Eligibility Predictor</h1>
      <p class="note">Enter applicant details to get a machine-learning prediction. This demo is not financial advice or a lending decision.</p>
      <form id="prediction-form">
        <div class="fields">
          <label>Gender<select name="Gender"><option>Male</option><option>Female</option></select></label>
          <label>Married<select name="Married"><option>Yes</option><option>No</option></select></label>
          <label>Dependents<select name="Dependents"><option>0</option><option>1</option><option>2</option><option>3+</option></select></label>
          <label>Education<select name="Education"><option>Graduate</option><option>Not Graduate</option></select></label>
          <label>Self employed<select name="Self_Employed"><option>No</option><option>Yes</option></select></label>
          <label>Applicant income<input name="ApplicantIncome" type="number" min="0" step="any" required></label>
          <label>Co-applicant income<input name="CoapplicantIncome" type="number" min="0" step="any" value="0" required></label>
          <label>Loan amount (thousands)<input name="LoanAmount" type="number" min="0" step="any" required></label>
          <label>Loan term (months)<input name="Loan_Amount_Term" type="number" min="1" step="any" value="360" required></label>
          <label>Credit history<select name="Credit_History"><option value="1">Meets guidelines</option><option value="0">Does not meet guidelines</option></select></label>
          <label>Property area<select name="Property_Area"><option>Urban</option><option>Semiurban</option><option>Rural</option></select></label>
        </div>
        <button type="submit">Predict eligibility</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#prediction-form");
      const result = document.querySelector("#result");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const applicant = Object.fromEntries(new FormData(form).entries());
        for (const key of ["ApplicantIncome", "CoapplicantIncome", "LoanAmount", "Loan_Amount_Term", "Credit_History"]) {
          applicant[key] = Number(applicant[key]);
        }
        result.textContent = "Calculating...";
        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(applicant),
          });
          const data = await response.json();
          result.textContent = response.ok ? `Prediction: ${data.eligibility}` : data.error;
        } catch {
  result.textContent = "Could not reach the prediction service.";
}
      });
    </script>
  </body>
</html>
