[project]
name = "loan-eligibility-prediction"
version = "1.0.0"
description = "A Flask app for a machine-learning loan eligibility demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
